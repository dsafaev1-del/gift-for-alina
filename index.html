<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Подарок 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #fff;
    background: #1a0033;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
  }

  /* ============================================
     ЗАСТАВКА В СТИЛЕ IPHONE
     ============================================ */
  .splash {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
    cursor: pointer;
    transition: opacity 0.6s ease, visibility 0.6s;
  }
  .splash.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .splash-content {
    text-align: center;
    max-width: 320px;
    animation: splashIn 0.8s cubic-bezier(0.25, 1, 0.5, 1);
  }
  @keyframes splashIn {
    from { opacity: 0; transform: translateY(20px) scale(0.92); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .bell-wrap {
    position: relative;
    width: 90px;
    height: 90px;
    margin: 0 auto 26px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bell-svg {
    width: 72px;
    height: 72px;
    animation: bellRing 2.4s ease-in-out infinite;
    transform-origin: 50% 20%;
  }
  @keyframes bellRing {
    0%, 70%, 100% { transform: rotate(0deg); }
    75%           { transform: rotate(-12deg); }
    80%           { transform: rotate(12deg); }
    85%           { transform: rotate(-8deg); }
    90%           { transform: rotate(8deg); }
  }
  .bell-slash {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 90px;
    height: 3px;
    background: #ff3b30;
    border-radius: 2px;
    transform: translate(-50%, -50%) rotate(-45deg);
    box-shadow: 0 0 12px rgba(255, 59, 48, 0.6);
    animation: slashPulse 2s ease-in-out infinite;
  }
  @keyframes slashPulse {
    0%, 100% { opacity: 0.85; }
    50%      { opacity: 1; }
  }
  .splash-title {
    font-size: 24px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 12px;
    letter-spacing: -0.3px;
  }
  .splash-text {
    font-size: 16px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.7);
    line-height: 1.5;
    margin-bottom: 40px;
    letter-spacing: -0.2px;
  }
  .splash-hint {
    font-size: 13px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.4);
    animation: hintPulse 2s ease-in-out infinite;
    letter-spacing: 0.2px;
  }
  @keyframes hintPulse {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 0.85; }
  }

  /* ============================================ */

  .sky {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #2d0b5a 0%, #6b1a7a 20%, #c7367f 40%, #ff5f6d 60%, #ff9966 75%, #ffd166 90%, #ff5f6d 100%);
    background-size: 400% 400%;
    animation: skyShift 18s ease infinite;
    z-index: 0;
  }
  @keyframes skyShift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.5;
    z-index: 1;
    pointer-events: none;
    animation: blobFloat 14s ease-in-out infinite;
  }
  .blob.b1 { width: 380px; height: 380px; background: #ff2e94; top: -100px; left: -100px; }
  .blob.b2 { width: 340px; height: 340px; background: #4b2eff; bottom: -80px; right: -80px; animation-delay: -3s; }
  .blob.b3 { width: 300px; height: 300px; background: #ffd166; top: 40%; left: 60%; opacity: 0.35; animation-delay: -6s; }
  @keyframes blobFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(40px, -30px) scale(1.1); }
    66%      { transform: translate(-30px, 40px) scale(0.95); }
  }

  .star {
    position: fixed;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    opacity: 0;
    z-index: 2;
    box-shadow: 0 0 6px rgba(255, 255, 255, 0.9);
    animation: twinkle linear infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.6); }
    50%      { opacity: 1; transform: scale(1.2); }
  }

  .balloon {
    position: fixed;
    bottom: -120px;
    z-index: 2;
    font-size: 42px;
    pointer-events: none;
    user-select: none;
    filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.3));
    animation: balloonRise linear forwards;
    will-change: transform;
  }
  @keyframes balloonRise {
    0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    50%  { transform: translateY(-50vh) translateX(20px) rotate(8deg); }
    90%  { opacity: 1; }
    100% { transform: translateY(-110vh) translateX(-20px) rotate(-8deg); opacity: 0; }
  }

  .confetti {
    position: fixed;
    top: -20px;
    z-index: 4;
    pointer-events: none;
    will-change: transform;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg) scale(0.8); opacity: 0; }
  }

  .heart {
    position: fixed;
    top: -40px;
    z-index: 5;
    pointer-events: none;
    user-select: none;
    will-change: transform;
    filter: drop-shadow(0 0 10px rgba(255, 100, 180, 0.7));
  }
  @keyframes heartFall {
    0%   { transform: translateY(0) translateX(0) rotate(0deg) scale(0.6); opacity: 0; }
    10%  { opacity: 1; transform: translateY(10vh) translateX(-10px) rotate(-15deg) scale(1); }
    50%  { transform: translateY(55vh) translateX(30px) rotate(15deg) scale(1.1); }
    90%  { opacity: 1; }
    100% { transform: translateY(115vh) translateX(-20px) rotate(-10deg) scale(0.9); opacity: 0; }
  }

  .cat {
    position: fixed;
    bottom: 12px;
    z-index: 3;
    pointer-events: none;
    user-select: none;
    font-size: 42px;
    line-height: 1;
    filter: drop-shadow(0 6px 6px rgba(0, 0, 0, 0.45)) drop-shadow(0 0 14px rgba(255, 220, 150, 0.4));
    animation: catWalk linear forwards;
    will-change: left, transform;
  }
  @keyframes catWalk {
    0%   { left: -80px; transform: translateY(0) rotate(0deg); }
    25%  { transform: translateY(-8px) rotate(-3deg); }
    50%  { left: 50vw;  transform: translateY(0) rotate(0deg); }
    75%  { transform: translateY(-8px) rotate(3deg); }
    100% { left: 110vw; transform: translateY(0) rotate(0deg); }
  }

  .cat-sit {
    position: fixed;
    bottom: 20px;
    z-index: 3;
    pointer-events: none;
    user-select: none;
    font-size: 52px;
    line-height: 1;
    filter: drop-shadow(0 8px 8px rgba(0, 0, 0, 0.4)) drop-shadow(0 0 18px rgba(255, 200, 150, 0.4));
    animation: catIdle 4s ease-in-out infinite;
  }
  .cat-sit.left  { left: 22px; }
  .cat-sit.right { right: 22px; animation-delay: 1.2s; }
  @keyframes catIdle {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-6px) rotate(3deg); }
  }

  .card {
    position: relative;
    z-index: 5;
    background: rgba(30, 10, 50, 0.55);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 24px;
    padding: 52px 34px 46px;
    max-width: 460px;
    width: 100%;
    text-align: center;
    box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5), 0 0 60px rgba(255, 100, 200, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    animation: cardIn 0.9s cubic-bezier(0.25, 1, 0.5, 1);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card.fade-out {
    opacity: 0;
    transform: translateY(-8px) scale(0.97);
  }

  .progress {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 38px;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.25);
    transition: all 0.5s ease;
  }
  .dot.active {
    background: linear-gradient(135deg, #ffd166, #ff5f6d);
    box-shadow: 0 0 10px rgba(255, 200, 100, 0.8);
  }
  .dot.current { width: 22px; border-radius: 3px; }

  .step-num {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    color: #ffd166;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 24px;
    display: block;
    text-shadow: 0 0 20px rgba(255, 200, 100, 0.6);
  }

  .emoji-wrap { margin-bottom: 24px; display: block; }
  .emoji {
    font-size: 58px;
    display: inline-block;
    filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.4)) drop-shadow(0 0 24px rgba(255, 200, 100, 0.6));
    animation: softFloat 4s ease-in-out infinite;
  }
  @keyframes softFloat {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-10px) rotate(3deg); }
  }

  .ring-scene {
    position: relative;
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }
  .ring-glow {
    position: absolute;
    width: 190px;
    height: 190px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 220, 130, 0.65) 0%, transparent 65%);
    animation: glowPulse 3s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50%      { transform: scale(1.25); opacity: 1; }
  }
  .ring {
    font-size: 72px;
    position: relative;
    z-index: 2;
    animation: ringShine 4s ease-in-out infinite;
    filter: drop-shadow(0 0 30px rgba(255, 220, 150, 1)) drop-shadow(0 8px 12px rgba(0, 0, 0, 0.3));
  }
  @keyframes ringShine {
    0%, 100% { transform: scale(1) rotate(-5deg); }
    50%      { transform: scale(1.1) rotate(5deg); }
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 18px;
    line-height: 1.25;
    letter-spacing: 0.5px;
    text-shadow: 0 0 30px rgba(255, 150, 200, 0.6), 0 4px 12px rgba(0, 0, 0, 0.3);
  }
  h1 .name {
    display: block;
    font-style: italic;
    font-weight: 400;
    font-size: 22px;
    color: #ffd166;
    margin-bottom: 8px;
    letter-spacing: 2px;
    text-shadow: 0 0 20px rgba(255, 200, 100, 0.8);
  }

  p {
    font-size: 15.5px;
    font-weight: 300;
    color: rgba(255, 255, 255, 0.92);
    line-height: 1.85;
    margin-bottom: 32px;
    letter-spacing: 0.2px;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  }
  p em {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 19px;
    color: #ffd166;
    text-shadow: 0 0 15px rgba(255, 200, 100, 0.6);
  }
  p .hint {
    display: block;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid rgba(255, 255, 255, 0.15);
    font-size: 12px;
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
    color: rgba(255, 220, 150, 0.85);
    letter-spacing: 1.5px;
  }

  button {
    background: linear-gradient(135deg, #ff5f6d 0%, #ffc371 50%, #ff5f6d 100%);
    background-size: 200% auto;
    color: #2a0845;
    border: none;
    padding: 17px 42px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.35s ease;
    box-shadow: 0 12px 32px rgba(255, 95, 109, 0.5), 0 0 24px rgba(255, 200, 100, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    position: relative;
    overflow: hidden;
  }
  button:hover {
    background-position: 200% center;
    transform: translateY(-3px);
    box-shadow: 0 18px 40px rgba(255, 95, 109, 0.7), 0 0 32px rgba(255, 200, 100, 0.6);
  }
  button:active { transform: translateY(-1px) scale(0.98); }

  .card.final {
    background: rgba(50, 10, 70, 0.65);
    border-color: rgba(255, 220, 150, 0.5);
    box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5), 0 0 80px rgba(255, 150, 200, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
  }
  .card.final h1 {
    font-size: 42px;
    background: linear-gradient(135deg, #fff 0%, #ffd166 50%, #ff5f6d 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 3s linear infinite;
    text-shadow: none;
  }
  @keyframes gradientShift {
    to { background-position: 200% center; }
  }

  .music-btn {
    position: fixed;
    top: 22px;
    right: 22px;
    z-index: 10;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    padding: 0;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
  }
  .music-btn:hover { background: rgba(255, 255, 255, 0.25); transform: scale(1.08); }
  .music-btn.playing { animation: musicSpin 4s linear infinite; }
  @keyframes musicSpin {
    from { transform: rotate(0); }
    to   { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<!-- ЗАСТАВКА -->
<div class="splash" id="splash">
  <div class="splash-content">
    <div class="bell-wrap">
      <svg class="bell-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5S10.5 3.17 10.5 4v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" fill="#fff"/>
      </svg>
      <div class="bell-slash"></div>
    </div>
    <div class="splash-title">Прибавь громкость</div>
    <div class="splash-text">Для лучшего впечатления<br>выключи беззвучный режим</div>
    <div class="splash-hint">Коснись экрана, чтобы продолжить</div>
  </div>
</div>

<div class="sky"></div>
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<audio id="bgMusic" loop></audio>
<button class="music-btn" id="musicBtn" title="Музыка">♪</button>

<script>
  const MUSIC_URL = "";

  const steps = [
    { emoji: "🎂", title: "Эту веб-страницу я сделал специально для тебя", text: "Не тыкай всё подряд — читай внимательно и следуй шагам. Надеюсь, ты оценишь.", button: "Поняла" },
    { emoji: "🔑", step: "Шаг 1", title: "Иди туда, где я обычно сижу", text: "Там, на моём рабочем месте, спрятано кое-что для тебя. Поищи хорошенько.", button: "Нашла" },
    { emoji: "🎫", step: "Шаг 2", title: "Там же должна быть карточка", text: "Небольшая такая, похожа на пропуск. Прихвати её с собой — без неё дальше никак.", button: "Взяла" },
    { emoji: "🚗", step: "Шаг 3", title: "Спускайся на парковку", text: "Ключи, которые ты нашла — от машины. Она стоит на подземной парковке. Карточка откроет тебе туда доступ.", button: "Иду" },
    { emoji: "🔍", step: "Шаг 4", title: "Загляни между креслами", text: "Там есть небольшое отделение под стаканы. То, что ты ищешь — внутри.", hint: "Не спеши", button: "Открываю" },
    { emoji: "💍", ring: true, step: "Вот оно", title: "Твой подарок", text: "Надеюсь, понравится. И кстати — квест на этом не заканчивается.", button: "Дальше" },
    { emoji: "🏠", step: "И последнее", title: "Возвращайся домой", text: "Возьми кольцо с собой и поднимайся обратно в квартиру. У тебя есть всё время мира.", button: "Иду домой" },
    { emoji: "✨", step: "Последний шаг", title: "Закрой глаза", text: "Зайди в комнату, закрой глаза и подожди немного. И не подглядывай, пожалуйста.", button: "Закрыла" }
  ];

  const finalScreen = {
    title: "С днём рождения",
    text: "Очень рад, что ты у меня есть."
  };

  // ============================================
  //   ЗВУК «МИУ» — короткий, высокий, милый
  // ============================================

  let audioCtx = null;

  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playMeow() {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;

    // Короткое «миу» — общая длительность ~0.22 сек
    const dur = 0.22 + Math.random() * 0.05;

    // Высокий тон — диапазон детского писка
    const base = 880 + Math.random() * 120;   // 880–1000 Гц

    // === Источник — чистый синус, главный тон ===
    const osc = ctx.createOscillator();
    osc.type = 'sine';

    // Контур: «ми» (вверх) → «у» (вниз).
    // Быстрый подъём в первые 30%, потом спад в 2 раза.
    osc.frequency.setValueAtTime(base * 0.85, now);
    osc.frequency.linearRampToValueAtTime(base * 1.15, now + dur * 0.25);
    osc.frequency.linearRampToValueAtTime(base * 1.20, now + dur * 0.40);
    osc.frequency.linearRampToValueAtTime(base * 0.62, now + dur);

    // === Второй голос — легкая подкраска «и» ===
    const osc2 = ctx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(base * 2 * 0.85, now);
    osc2.frequency.linearRampToValueAtTime(base * 2 * 1.20, now + dur * 0.40);
    osc2.frequency.linearRampToValueAtTime(base * 2 * 0.62, now + dur);
    const osc2Gain = ctx.createGain();
    osc2Gain.gain.value = 0.10;

    // === Форманта «и» → «у» ===
    // «И» — высокий резонанс (2700 Гц), «у» — низкий (900 Гц).
    // Этот переход и даёт узнаваемое «миу».
    const formant = ctx.createBiquadFilter();
    formant.type = 'bandpass';
    formant.frequency.setValueAtTime(2700, now);
    formant.frequency.linearRampToValueAtTime(2400, now + dur * 0.35);
    formant.frequency.linearRampToValueAtTime(900, now + dur);
    formant.Q.value = 3.5;

    // === Огибающая громкости — быстрая и чёткая ===
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.35, now + 0.015);   // мгновенный старт
    gain.gain.setValueAtTime(0.32, now + dur * 0.45);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

    // === Соединение ===
    osc.connect(formant);
    osc2.connect(osc2Gain);
    osc2Gain.connect(formant);
    formant.connect(gain);
    gain.connect(ctx.destination);

    // === Запуск ===
    osc.start(now);   osc.stop(now + dur);
    osc2.start(now);  osc2.stop(now + dur);
  }

  // ============================================
  //   ЗАСТАВКА
  // ============================================

  const splash = document.getElementById('splash');
  splash.addEventListener('click', () => {
    splash.classList.add('hidden');
    try { getAudioCtx(); } catch(e) {}
  }, { once: true });

  // ============================================
  //   ЛОГИКА
  // ============================================

  const card = document.createElement('div');
  card.className = 'card';
  document.body.appendChild(card);

  let current = 0;
  let isPlaying = false;

  for (let i = 0; i < 70; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDuration = (2 + Math.random() * 4) + 's';
    s.style.animationDelay = Math.random() * 6 + 's';
    if (Math.random() > 0.7) s.style.width = s.style.height = '3px';
    document.body.appendChild(s);
  }

  function spawnBalloon() {
    const b = document.createElement('div');
    b.className = 'balloon';
    b.textContent = '🎈';
    const hue = Math.floor(Math.random() * 360);
    b.style.filter = `drop-shadow(0 6px 12px rgba(0,0,0,0.3)) hue-rotate(${hue}deg) saturate(1.4)`;
    b.style.left = (5 + Math.random() * 90) + 'vw';
    b.style.fontSize = (32 + Math.random() * 26) + 'px';
    b.style.animationDuration = (10 + Math.random() * 8) + 's';
    b.style.animationDelay = Math.random() * 2 + 's';
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 22000);
  }
  setInterval(spawnBalloon, 3200);
  for (let i = 0; i < 4; i++) setTimeout(spawnBalloon, i * 900);

  const sitLeft = document.createElement('div');
  sitLeft.className = 'cat-sit left';
  sitLeft.textContent = '🐱';
  document.body.appendChild(sitLeft);

  const sitRight = document.createElement('div');
  sitRight.className = 'cat-sit right';
  sitRight.textContent = '🐈';
  document.body.appendChild(sitRight);

  const catEmojis = ['🐈', '🐈‍⬛', '🐱', '🐈', '🐈‍⬛'];
  function spawnCat() {
    const c = document.createElement('div');
    c.className = 'cat';
    c.textContent = catEmojis[Math.floor(Math.random() * catEmojis.length)];
    c.style.animationDuration = (12 + Math.random() * 6) + 's';
    c.style.fontSize = (38 + Math.random() * 12) + 'px';
    c.style.bottom = (8 + Math.random() * 24) + 'px';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 22000);
  }
  setInterval(spawnCat, 5200);
  setTimeout(spawnCat, 800);
  setTimeout(spawnCat, 2600);

  const confettiColors = ['#ff5f6d', '#ffd166', '#4b9eff', '#c471ed', '#39d98a', '#ff7eb6', '#fff'];
  function burstConfetti(count = 45) {
    for (let i = 0; i < count; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      const size = 5 + Math.random() * 8;
      c.style.width = c.style.height = size + 'px';
      c.style.animation = `confettiFall ${2.5 + Math.random() * 2.5}s linear ${Math.random() * 0.5}s forwards`;
      if (Math.random() > 0.85) {
        c.style.width = c.style.height = '0';
        c.style.border = 'none';
        c.textContent = '✨';
        c.style.fontSize = (12 + Math.random() * 8) + 'px';
        c.style.background = 'transparent';
      }
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 6500);
    }
  }

  const heartEmojis = ['❤️', '💖', '💕', '💗', '💓', '💝', '🩷'];
  function burstHearts(count = 30) {
    for (let i = 0; i < count; i++) {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.fontSize = (18 + Math.random() * 22) + 'px';
      const dur = 3 + Math.random() * 3;
      const delay = Math.random() * 1.5;
      h.style.animation = `heartFall ${dur}s ease-in ${delay}s forwards`;
      document.body.appendChild(h);
      setTimeout(() => h.remove(), (dur + delay + 0.5) * 1000);
    }
  }

  function render() {
    const isFinal = current >= steps.length;
    const data = isFinal ? finalScreen : steps[current];

    let progressHTML = '';
    if (!isFinal) {
      progressHTML = '<div class="progress">';
      for (let i = 0; i < steps.length; i++) {
        let cls = 'dot';
        if (i < current) cls += ' active';
        if (i === current) cls += ' active current';
        progressHTML += `<div class="${cls}"></div>`;
      }
      progressHTML += '</div>';
    }

    let mediaHTML = '';
    if (data.ring) {
      mediaHTML = `<div class="ring-scene"><div class="ring-glow"></div><div class="ring">💍</div></div>`;
    } else if (data.emoji) {
      mediaHTML = `<span class="emoji-wrap"><span class="emoji">${data.emoji}</span></span>`;
    }

    const stepHTML = data.step ? `<span class="step-num">${data.step}</span>` : '';
    const nameHTML = data.name ? `<span class="name">${data.name}</span>` : '';
    const hintHTML = data.hint ? `<span class="hint">${data.hint}</span>` : '';
    const buttonHTML = data.button ? `<button id="nextBtn">${data.button}</button>` : '';

    card.className = 'card' + (isFinal ? ' final' : '');
    card.innerHTML = `
      ${progressHTML}
      ${stepHTML}
      ${mediaHTML}
      <h1>${nameHTML}${data.title}</h1>
      <p>${data.text}${hintHTML}</p>
      ${buttonHTML}
    `;

    const btn = document.getElementById('nextBtn');
    if (btn) btn.addEventListener('click', () => { playMeow(); next(); });

    if (isFinal) {
      burstConfetti(100); burstHearts(35);
      setTimeout(() => { burstConfetti(80); burstHearts(30); }, 1200);
      setTimeout(() => { burstConfetti(60); burstHearts(35); }, 2400);
      setTimeout(() => { burstConfetti(60); burstHearts(30); }, 3600);
      setTimeout(() => burstHearts(40), 5000);
    } else {
      burstConfetti(30);
    }
  }

  function next() {
    card.classList.add('fade-out');
    setTimeout(() => {
      card.classList.remove('fade-out');
      if (current < steps.length) { current++; render(); }
    }, 480);
  }

  const musicBtn = document.getElementById('musicBtn');
  const musicEl = document.getElementById('bgMusic');

  if (MUSIC_URL) {
    musicEl.innerHTML = `<source src="${MUSIC_URL}" type="audio/mpeg">`;
  } else {
    musicBtn.style.display = 'none';
  }

  musicBtn.addEventListener('click', () => {
    if (isPlaying) {
      musicEl.pause();
      musicBtn.classList.remove('playing');
      musicBtn.textContent = '♪';
    } else {
      musicEl.volume = 0.3;
      musicEl.play().catch(() => {});
      musicBtn.classList.add('playing');
      musicBtn.textContent = '♫';
    }
    isPlaying = !isPlaying;
  });

  render();
</script>

</body>
</html>
